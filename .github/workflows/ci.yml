name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # Apple Silicon runner: matches the primary target and exercises the Metal wheels.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Import check
        working-directory: backend
        run: python -c "import main"
      - name: Tests
        working-directory: backend
        run: |
          python tests/test_coach.py
          python tests/test_adaptive.py
          python tests/test_meeting_api.py
          python tests/test_prompter_api.py
          python tests/test_secure_store.py
      - name: Vulnerability audit
        working-directory: backend
        run: pip-audit -r requirements.txt --progress-spinner=off

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - name: Vulnerability audit (production deps)
        run: npm audit --omit=dev --audit-level=high
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
